name: enphase-battery-hum
components:
  - id: main
    capabilities:
      - id: battery
        version: 1
      - id: powerMeter
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Battery
preferences:
  - name: batteryGraph
    title: Battery history graph
    description: "SmartThings draws no graph for battery %. Humidity: battery % also as a humidity reading on this device (graph in %, the device then also counts as a humidity sensor). Power: battery % as watts in an extra part Battery % (1 % = 1 W)."
    required: false
    preferenceType: enumeration
    definition:
      options:
        "off": "Off"
        humidity: "Humidity (%)"
        power: "Power (W)"
      default: "off"
