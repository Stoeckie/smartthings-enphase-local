name: enphase-gateway
components:
  - id: main
    capabilities:
      - id: silvervalley08660.connectionStatus
        version: 1
      - id: silvervalley08660.connectionLog
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Bridges
preferences:
  - name: offlineAfter
    title: Offline after (minutes)
    description: "Connection only turns Offline after this many minutes without contact, so a short network outage (e.g. a router update at night) gives no notification."
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 120
      default: 5
  - name: ipAddress
    title: Gateway IP address
    description: Leave on "auto" (found via mDNS / envoy.local). Set an IP only if that fails.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: pollInterval
    title: Poll interval (seconds)
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 30
